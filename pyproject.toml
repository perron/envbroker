[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envbroker"
version = "0.1.1"
description = "Run commands with secrets injected into the child environment, without ever printing the values."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "cli", "secrets", "environment"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/envbroker"
Repository = "https://github.com/perron/envbroker"
Issues = "https://github.com/perron/envbroker/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
envbroker = "envbroker.cli:main"

[tool.setuptools.packages.find]
include = ["envbroker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
