[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envbroker"
version = "0.1.0"
description = "Run commands with secrets injected into the child environment, without ever printing the values."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
envbroker = "envbroker.cli:main"

[tool.setuptools.packages.find]
include = ["envbroker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
